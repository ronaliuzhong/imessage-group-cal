# The iPhone app's Xcode project, described for XcodeGen
# (https://github.com/yonaskolb/XcodeGen). The real project file,
# GroupCal.xcodeproj, is generated from this one and isn't in git:
#
#   brew install xcodegen      # once
#   cd ios && xcodegen         # after cloning, and after changing this file
#   open GroupCal.xcodeproj
#
# Change project settings here, not in Xcode: Xcode's changes are lost the
# next time the project is generated.

name: GroupCal

options:
  bundleIdPrefix: com.ronaliuzhong
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true

# Who signs the app and the IDs it uses (DEVELOPMENT_TEAM, BUNDLE_ID_PREFIX)
# live in Signing.xcconfig, so each person can use their own Apple account
# for their own phone without changing this file. See Signing.xcconfig.
configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    CODE_SIGN_STYLE: Automatic
    # The App Group lets the app and the extension share the saved sign-in.
    APP_GROUP_ID: group.$(BUNDLE_ID_PREFIX).groupcal
    MARKETING_VERSION: "0.1"
    CURRENT_PROJECT_VERSION: "1"
    TARGETED_DEVICE_FAMILY: "1" # iPhone only
  configs:
    # The server the app and extension talk to (read via Config.swift).
    # Debug (running from Xcode): your Mac's dev server in the simulator. A
    # real iPhone can't reach your Mac's localhost (and Google sign-in only
    # accepts localhost from the Mac), so phones use the live site.
    Debug:
      API_BASE_URL: http://localhost:3000
      "API_BASE_URL[sdk=iphoneos*]": https://imessage-group-cal.vercel.app
    # Release (TestFlight, App Store): the live site.
    Release:
      API_BASE_URL: https://imessage-group-cal.vercel.app

# Info.plist entries both targets need.
infoShared: &infoShared
  # "Group Cal" is a placeholder until the app is named.
  CFBundleDisplayName: Group Cal
  CFBundleShortVersionString: $(MARKETING_VERSION)
  CFBundleVersion: $(CURRENT_PROJECT_VERSION)
  API_BASE_URL: $(API_BASE_URL)
  # Read by TokenStore (Shared/TokenStore.swift).
  AppGroupID: $(APP_GROUP_ID)
  # Lets the simulator reach the dev server on http://localhost.
  NSAppTransportSecurity:
    NSAllowsLocalNetworking: true

# The App Group lets the app and the extension share the saved sign-in.
entitlementsShared: &entitlementsShared
  com.apple.security.application-groups:
    - $(APP_GROUP_ID)

targets:
  # The app you open from the home screen (kept minimal; see ROADMAP.md).
  # Apple requires an app to carry the iMessage extension; people can also
  # sign in right from the extension.
  GroupCal:
    type: application
    platform: iOS
    sources: [GroupCal, Shared]
    dependencies:
      - target: GroupCalMessages
    info:
      path: GroupCal/Info.plist
      properties:
        <<: *infoShared
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    entitlements:
      path: GroupCal/GroupCal.entitlements
      properties: *entitlementsShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).groupcal
    scheme:
      testTargets: [GroupCalTests]

  # The iMessage extension: Group Cal inside a group chat. The main way
  # people use Group Cal, including signing in.
  GroupCalMessages:
    type: app-extension.messages
    platform: iOS
    sources: [GroupCalMessages, Shared]
    info:
      path: GroupCalMessages/Info.plist
      properties:
        <<: *infoShared
        NSExtension:
          NSExtensionPointIdentifier: com.apple.message-payload-provider
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).MessagesViewController
    entitlements:
      path: GroupCalMessages/GroupCalMessages.entitlements
      properties: *entitlementsShared
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(BUNDLE_ID_PREFIX).groupcal.messages

  GroupCalTests:
    type: bundle.unit-test
    platform: iOS
    sources: [GroupCalTests]
    dependencies:
      - target: GroupCal
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

schemes:
  # Runs the iMessage extension inside Messages. It builds the Group Cal app
  # too: an extension can only be installed inside its app, so on a real
  # iPhone building the extension alone installs nothing.
  GroupCalMessages:
    build:
      targets:
        GroupCal: all
        GroupCalMessages: all
    run:
      config: Debug
      askForAppToLaunch: true
    archive:
      config: Release
